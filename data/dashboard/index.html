<!DOCTYPE html>
<html>
<head>
  <title>SCADA Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>SCADA Monitoring Dashboard</h1>
  <div id="status"></div>
  <canvas id="sensorChart" width="400" height="200"></canvas>
  <script>
    async function fetchData() {
      const response = await fetch('../data/sensor.json');
      const data = await response.json();
      document.getElementById('status').innerText = `Status: ${data.status}, Time: ${data.timestamp}`;
      const ctx = document.getElementById('sensorChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Temperature', 'Humidity'],
          datasets: [{
            label: 'Sensor Data',
            data: [data.temperature, data.humidity],
            backgroundColor: ['#ff6384', '#36a2eb']
          }]
        }
      });
    }
    fetchData();
  </script>
</body>
</html>
